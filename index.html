<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Log</title>
<meta name="theme-color" content="#f5f3f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d13" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* VOICE: calm, personal, a little proud of the streak.
   IDEA: the handwritten daily challenge page, turned into a phone ledger. Sister app to Spend Log.
   PICTURE: the dark statement card (Day N/500, today's score, the week) and the habit list under it.
   COLOUR and TYPE: Spend Log's violet-on-lilac, Geist; purple only where you act or where "now" is. Dark mode follows the phone.
   LAYOUT: one phone column, hairline-ruled cards, floating pill tab bar. */
:root{
  --bg:#f5f3f8; --surface:#ffffff; --raised:#f0edf5; --line:#e6e1ee; --ink:#141217; --muted:#6e6878;
  --accent:#6d28d9; --act:#141217; --act-ink:#ffffff; --soft:#efe8fc; --on-accent:#ffffff;
  --hero-bg:#17121f; --hero-ink:#ffffff; --hero-muted:#a9a1b8; --hero-line:rgba(255,255,255,.1); --hero-accent:#c4b5fd; --hero-bar:rgba(255,255,255,.14);
  --nav-bg:rgba(20,18,23,.94); --nav-ink:#a9a4b2; --nav-on:#141217; --nav-on-bg:#ffffff;
  --danger:#c0264b; --shadow:0 1px 2px rgba(20,18,23,.04), 0 8px 24px -16px rgba(40,20,80,.18);
  color-scheme:light;
  --sans:"Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme=light]){
  --bg:#0f0d13; --surface:#18151e; --raised:#221e2a; --line:#2c2735; --ink:#f2eff7; --muted:#9a93a6;
  --accent:#a78bfa; --act:#f2eff7; --act-ink:#141217; --soft:#241c36; --on-accent:#140f1f;
  --hero-bg:#1f1830; --nav-bg:rgba(34,30,42,.94); --nav-on:#141217; --nav-on-bg:#f2eff7;
  --danger:#f0627f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme=dark]{
  --bg:#0f0d13; --surface:#18151e; --raised:#221e2a; --line:#2c2735; --ink:#f2eff7; --muted:#9a93a6;
  --accent:#a78bfa; --act:#f2eff7; --act-ink:#141217; --soft:#241c36; --on-accent:#140f1f;
  --hero-bg:#1f1830; --nav-bg:rgba(34,30,42,.94); --nav-on:#141217; --nav-on-bg:#f2eff7;
  --danger:#f0627f; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 112px)}
main{display:flex;flex-direction:column;gap:14px}
h1{font:600 22px/1.2 var(--sans);margin:2px 0 4px;letter-spacing:-.01em}
h2{font-size:11px;font-weight:600;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.num{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:0;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* statement card */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:500;color:var(--hero-muted);letter-spacing:.02em}
.pill{font-size:12px;color:var(--hero-muted);border:1px solid var(--hero-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.on{color:var(--hero-accent);border-color:color-mix(in srgb,var(--hero-accent) 40%,transparent)}
.big{font:600 30px/1.15 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--hero-ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .sub{font-size:15px;font-weight:500;color:var(--hero-muted)}
.week{display:flex;align-items:flex-end;gap:10px;height:56px}
.week div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.week i{display:block;width:100%;max-width:22px;min-height:3px;border-radius:4px;background:var(--hero-bar)}
.week span{font-size:10px;font-weight:600;color:var(--hero-muted);letter-spacing:.06em}
.week .now i{background:var(--hero-accent)}
.week .now span{color:var(--hero-ink)}
.htrack{height:6px;border-radius:3px;background:var(--hero-bar);overflow:hidden}
.htrack i{display:block;height:100%;border-radius:3px;background:var(--hero-accent);min-width:3px}
.hero .stats{border-top:1px solid var(--hero-line);padding-top:14px}
.stats{display:flex;gap:10px}
.stat{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--muted)}
.stat b{font-size:17px;font-weight:600;color:var(--ink)}
.hero .stat{color:var(--hero-muted)} .hero .stat b{color:var(--hero-ink)}
.hero .stat + .stat{border-left:1px solid var(--hero-line);padding-left:14px}

/* day nav */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav strong{font:600 18px/1.2 var(--sans);text-align:center;display:flex;flex-direction:column}
.monthnav strong small{font-size:12px;font-weight:500;color:var(--muted)}
.monthnav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.monthnav button:disabled{opacity:.3;cursor:default}

/* habits */
.habits{display:flex;flex-direction:column}
.habit{display:grid;grid-template-columns:34px minmax(0,1fr) auto 32px;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:62px}
.habit:first-child{border-top:0;padding-top:0}
.habit:last-child{padding-bottom:0}
.hname{display:flex;flex-direction:column;min-width:0;font-weight:500;line-height:1.3}
.hname .tgt{font-size:12px;font-weight:400;color:var(--muted)}
.valbox{display:flex;align-items:center;gap:5px;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:0 10px;min-height:44px}
.valbox:focus-within{border-color:var(--accent);background:var(--surface)}
.valbox input{width:62px;border:0;background:none;outline:none;text-align:right;font-size:16px;padding:0;min-height:42px}
.valbox input[type=time]{width:92px;text-align:left}
.valbox input[type=time]::-webkit-calendar-picker-indicator{display:none}
.valbox span{font-size:12px;color:var(--muted);white-space:nowrap}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.5}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);color:transparent;background:none;padding:0;justify-self:end}
.mark svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.habit.hit .mark{border:0;background:var(--accent);color:var(--on-accent)}
.habit.miss .mark{border:0;background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.toggle{grid-column:3 / 5;justify-self:end;display:flex;gap:6px}
.toggle button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.toggle button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.toggle button[aria-pressed="true"].yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toggle button[aria-pressed="true"].no{background:color-mix(in srgb,var(--danger) 15%,transparent);border-color:transparent;color:var(--danger)}
.ico{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;color:var(--c,var(--accent));background:color-mix(in srgb, var(--c,#8b5cf6) 15%, transparent)}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* moral */
.moral{display:flex;flex-direction:column;gap:6px}
.moral span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.moral textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;resize:none;outline:none;font:500 18px/1.4 var(--sans);padding:0 0 10px;caret-color:var(--accent);min-height:56px}
.moral textarea:focus{border-color:var(--accent)}

.mq{margin:0;font:500 19px/1.4 var(--sans);color:var(--ink);quotes:"\201C" "\201D";text-wrap:pretty}
.mq::before{content:open-quote}.mq::after{content:close-quote}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink)}
.links button.ghost{border-color:transparent;background:var(--soft);color:var(--accent)}
.mlist{display:flex;flex-direction:column}
.mitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mitem:first-child{border-top:0;padding-top:0}
.mitem p{margin:0;font-weight:500;overflow-wrap:anywhere}
.mitem small{grid-column:1;font-size:12px;color:var(--muted)}
.mitem small.on{color:var(--accent);font-weight:600}
.mitem button{grid-row:1 / span 2;grid-column:2;border:0;background:none;color:var(--danger);font-weight:600;padding:8px;min-height:44px}
.paste{width:100%;font-size:16px;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:110px;resize:vertical;color:var(--ink);font-family:var(--sans)}
.paste:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search{width:100%;font-size:16px;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px}
.search:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* forms + buttons */
.row{display:flex;gap:10px} .row > *{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select{font-size:16px;color:var(--ink);background:var(--raised);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
.field input:focus,.field select:focus,.hrow input:focus,.hrow select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;min-height:50px}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap} .btns .btn{flex:1}
.err{color:var(--danger);font-size:14px}
.nudge{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:10px 14px;font-size:14px}
.nudge button{border:0;background:none;color:var(--accent);font-weight:700;padding:6px}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--raised);gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-size:14px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,18,23,.12)}

/* progress */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:10px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em}
.cal button,.cal .pad{aspect-ratio:1;border:0;border-radius:10px;font-size:12px;font-weight:600;padding:0;background:var(--raised);color:var(--muted)}
.cal .pad{background:none}
.cal button:disabled{background:none;opacity:.4;cursor:default}
.cal button.hi{color:var(--on-accent)}
.cal button.lo{color:var(--ink)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.dots{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.dots i{display:block;aspect-ratio:1;border-radius:3px;background:var(--raised)}
.dots i.fut{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.dots i.today{box-shadow:0 0 0 2px var(--ink)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:15px}
.bar .name{font-weight:500}
.bar .pct{font-weight:600}
.ltrack{grid-column:2 / -1;height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.ltrack i{display:block;height:100%;border-radius:3px;background:var(--c);min-width:3px}
.lline{grid-column:2 / -1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-2px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}

/* journal */
.entries{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.jday{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line)}
.jday:first-child{border-top:0}
.jday:active{background:var(--raised)}
.jhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:var(--muted)}
.jhead .good{color:var(--accent)}
.jday q{font-size:16px;font-weight:500;color:var(--ink);quotes:"\201C" "\201D"}
.jday .none{font-size:14px;color:var(--muted)}
.jtrack{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.jtrack i{display:block;height:100%;background:var(--accent);border-radius:2px;min-width:3px}

/* setup */
.hrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:8px 10px}
.hrow + .hrow{border-top:1px solid var(--line);padding-top:12px}
.hrow input,.hrow select{min-width:0;width:100%;font-size:16px;background:var(--raised);border:1px solid transparent;border-radius:12px;padding:9px 12px;min-height:44px}
.hrow .opts{grid-column:2 / -1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.hrow .opts.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.hrow .opts.one{grid-template-columns:1fr}
.hrow .acts{display:flex}
.hrow .acts button{border:0;background:none;font-weight:600;padding:8px;min-height:44px;color:var(--muted)}
.hrow .acts button.del{color:var(--danger)}
.hrow button.add{border:0;background:none;color:var(--accent);font-weight:700;padding:8px;min-height:44px}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:0 18px;pointer-events:none}
nav div{pointer-events:auto;max-width:420px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--nav-bg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 12px 30px -12px rgba(0,0,0,.45)}
nav button{flex:1;min-width:0;border:0;background:none;border-radius:999px;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--nav-ink);min-height:46px}
nav button span{display:none}
nav button[aria-current="page"]{background:var(--nav-on-bg);color:var(--nav-on);flex:1.7}
nav button[aria-current="page"] span{display:inline}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(10,8,14,.55)}
dialog .sheet{display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font:600 18px/1.25 var(--sans)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.habit .mark,.toggle button{transition:background .15s,color .15s}
@media (prefers-reduced-motion: reduce){.toast,.habit .mark,.toggle button{transition:none}}
@media (max-width:380px){.valbox input{width:50px}.habit{grid-template-columns:30px minmax(0,1fr) auto 28px;gap:8px}.ico{width:30px;height:30px;border-radius:10px}}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
</div>

<nav aria-label="Sections"><div>
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Today</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Progress</span></button>
  <button data-tab="morals"><svg viewBox="0 0 24 24"><path d="M6 7h4v4c0 3.2-1.6 5.3-4 6.3M14 7h4v4c0 3.2-1.6 5.3-4 6.3"/></svg><span>Morals</span></button>
  <button data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span>Journal</span></button>
  <button data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Setup</span></button>
</div></nav>

<dialog id="askDlg">
  <div class="sheet">
    <h3 id="askTitle"></h3>
    <div id="askBody" class="muted"></div>
    <div class="btns" id="askBtns"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var KEY = 'daylog.v1';
var PALETTE = ['#d9822b','#3b82c4','#8a63d2','#3f9b5b','#c9a227','#2aa6a6','#d6457f','#c2553a','#5b6ee1','#8f8aa8'];
var KINDS = {check:'Done or not', min:'At least', max:'At most', before:'Before time'};
var DEFAULT_HABITS = [
  {id:'wake', name:'Wake up', kind:'before', target:390, unit:''},
  {id:'workout', name:'Workout', kind:'min', target:30, unit:'mins'},
  {id:'meditate', name:'Meditation', kind:'min', target:10, unit:'mins'},
  {id:'study', name:'Study', kind:'min', target:3, unit:'hours'},
  {id:'steps', name:'Steps', kind:'min', target:8000, unit:'steps'},
  {id:'water', name:'Water', kind:'min', target:3, unit:'L'},
  {id:'protein', name:'Protein', kind:'min', target:80, unit:'g'},
  {id:'junk', name:'No junk food', kind:'check', target:null, unit:''},
  {id:'screen', name:'Screen time', kind:'max', target:4, unit:'hours'},
  {id:'sleep', name:'Sleep', kind:'min', target:8, unit:'hours'}
];
var ICONS = {
  wake:'<path d="M12 3v3M5.6 7.6L7 9M18.4 7.6L17 9M3 17h18M7 17a5 5 0 0 1 10 0M6 21h12"/>',
  workout:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',
  meditate:'<circle cx="12" cy="5" r="2"/><path d="M12 8v5M6.5 11l5.5 2 5.5-2M4.5 19.5c2.2-3 4.6-4.5 7.5-4.5s5.3 1.5 7.5 4.5z"/>',

/* ---------- morals ---------- */
var writing = false;
function pickMoral(d){
  var r = state.days[d], cur = r && r.mid, used = {};
  state.moralRound.forEach(function(id){ used[id] = 1; });
  var pool = state.morals.filter(function(m){ return !used[m.id] && m.id !== cur; });
  if(!pool.length){ state.moralRound = []; pool = state.morals.filter(function(m){ return m.id !== cur; }); }
  if(!pool.length) pool = state.morals.slice();
  if(!pool.length) return;
  var m = pool[Math.floor(Math.random() * pool.length)];
  state.moralRound.push(m.id);
  r = state.days[d] || (state.days[d] = {v:{}, note:'', mid:null});
  r.note = m.text; r.mid = m.id; save();
}
function moralCard(d){
  var r = state.days[d], note = r ? r.note : '', n = state.morals.length;
  if(writing || (!note && !n)){
    return '<div class="card"><label class="moral"><span>Moral of the day</span><textarea id="note" rows="2" maxlength="240" placeholder="One line you want to remember">' + esc(note) + '</textarea></label>' +
      (writing ? '<div class="links"><button type="button" data-moral="done">Done</button></div>' : '<div class="small muted">Upload your own list in <button type="button" class="pill" data-go="morals" style="color:var(--accent);background:none">Morals</button> and one will show up here each day.</div>') + '</div>';
  }
  return '<div class="card"><h2>Moral of the day</h2>' +
    (note ? '<p class="mq">' + esc(note) + '</p>' : '<div class="muted">No moral for this day yet.</div>') +
    '<div class="links">' + (n ? '<button type="button" class="ghost" data-moral="another">' + (note ? 'Another one' : 'Pick a random one') + '</button>' : '') +
    '<button type="button" data-moral="write">' + (note ? 'Write my own' : 'Write one') + '</button></div></div>';
}
function cleanLine(s){
  s = s.replace(/^\uFEFF/, '').trim().replace(/^(?:[-*•–]|\d{1,4}[.)])\s+/, '').trim();
  if(/^(["'“‘])([\s\S]*)(["'”’])$/.test(s)) s = s.slice(1, -1).trim();
  return s.replace(/""/g, '"').replace(/\s+/g, ' ').slice(0, 240);
}
function addMorals(text){
  var have = {}; state.morals.forEach(function(m){ have[m.text.toLowerCase()] = 1; });
  var added = 0, dup = 0;
  text.split(/\r?\n/).forEach(function(line){
    var t = cleanLine(line);
    if(!t || /^(moral|morals|quote|quotes|text)$/i.test(t)) return;
    if(have[t.toLowerCase()]){ dup++; return; }
    have[t.toLowerCase()] = 1; state.morals.push({id:'m' + uid(), text:t}); added++;
  });
  save();
  return added ? 'Added ' + added + (added === 1 ? ' moral' : ' morals') + (dup ? ' (' + dup + ' already there)' : '') : (dup ? 'Those are all already in your list' : 'No morals found. Put one per line.');
}
var mq = '';
function viewMorals(){
  var t = today(), todayId = state.days[t] && state.days[t].mid, used = {};
  state.moralRound.forEach(function(id){ used[id] = 1; });
  var left = state.morals.filter(function(m){ return !used[m.id]; }).length;
  var q = mq.trim().toLowerCase();
  var list = state.morals.filter(function(m){ return !q || m.text.toLowerCase().indexOf(q) !== -1; }).slice().reverse();
  var html = '<h1>Morals</h1><div class="small muted">' + (state.morals.length
      ? state.morals.length + (state.morals.length === 1 ? ' moral' : ' morals') + '. One shows up on Today each day, in random order. None repeats until all have been shown (' + left + ' left in this round).'
      : 'Add your own morals here. Each day, Today shows one of them at random, and none repeats until all have been shown.') + '</div>' +
    '<form class="card" id="moralForm"><h2>Add morals</h2><textarea class="paste" id="moralText" placeholder="One per line, e.g.&#10;Protect your peace, even if it means disappointing others.&#10;Small steps every day beat big steps once." aria-label="Morals, one per line"></textarea>' +
      '<div class="btns"><button class="btn primary" type="submit">Add</button><label class="btn filebtn">Upload file<input type="file" id="moralFile" accept=".txt,.csv,text/plain,text/csv"></label></div>' +
      '<div class="small muted">Upload a .txt or .csv with one moral per line. Numbers, bullets and quote marks at the start are removed, and duplicates are skipped.</div></form>';
  if(!state.morals.length) return html;
  html += '<div class="card"><div class="cardhead"><h2>Your list</h2><button type="button" class="pill" data-moral="exportTxt" style="color:var(--accent);background:none">Export .txt</button></div>' +
    (state.morals.length > 8 ? '<input class="search" id="mq" type="search" placeholder="Search your morals" value="' + esc(mq) + '" aria-label="Search your morals">' : '') +
    '<div class="mlist">' + (list.length ? list.map(function(m){
      var tag = m.id === todayId ? '<small class="on">Today’s moral</small>' : used[m.id] ? '<small>Shown this round</small>' : '<small>Not shown yet</small>';
      return '<div class="mitem"><p>' + esc(m.text) + '</p>' + tag + '<button type="button" data-mdel="' + esc(m.id) + '" aria-label="Remove this moral">Remove</button></div>';
    }).join('') : '<div class="empty">No morals match “' + esc(mq) + '”.</div>') + '</div></div>' +
    '<button class="btn danger block" type="button" data-moral="clear">Remove all morals</button>';
  return html;
}

  }

/* ---------- backup ---------- */
function deliver(name, text, type){
  var blob = new Blob([text], {type:type});
  var done = function(){ state.lastExport = new Date().toISOString(); save(); render(true); };
  var file = null; try{ file = new File([blob], name, {type:type}); }catch(e){}
  var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if(touch && file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).then(done).catch(function(err){ if(err && err.name === 'AbortError') return; download(blob, name); done(); });
    return;
  }
  download(blob, name); done();
}
function download(blob, name){
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
function backupText(){ return JSON.stringify({app:'daylog', version:1, exportedAt:new Date().toISOString(), start:state.start, length:state.length, pass:state.pass, habits:state.habits, days:state.days, morals:state.morals, moralRound:state.moralRound}, null, 1); }
function exportCsv(){
  var q = function(s){ s = String(s); if(/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  var cols = state.habits.map(function(h){ return q(h.name + (h.unit && h.kind !== 'check' ? ' (' + h.unit + ')' : '')); });
  var rows = Object.keys(state.days).sort().map(function(k){
    var s = score(k);
    return [k, dayNo(k), s.pct].concat(state.habits.map(function(h){ var v = val(k, h.id); return v === null ? '' : h.kind === 'check' ? (v ? 'yes' : 'no') : h.kind === 'before' ? toTime(v) : v; }), [q(state.days[k].note)]).join(',');
  });
  deliver('daylog-' + today() + '.csv', ['date','day','score_pct'].concat(cols, ['moral']).join(',') + '\n' + rows.join('\n') + '\n', 'text/csv');
}
function importFile(file){
  var r = new FileReader();
  r.onerror = function(){ toast('Could not read that file.'); };
  r.onload = function(){
    var d = null; try{ d = clean(JSON.parse(r.result)); }catch(e){}
    if(!d){ ask('That file is not a Day Log backup', 'Choose a .json file made with Export backup.', [{label:'OK', cls:'primary'}]); return; }
    var have = Object.keys(state.days).length, inFile = Object.keys(d.days), news = inFile.filter(function(k){ return !state.days[k]; });
    var merge = function(){
      var ids = {}; state.habits.forEach(function(h){ ids[h.id] = 1; });
      d.habits.forEach(function(h){ if(!ids[h.id]) state.habits.push(h); });
      news.forEach(function(k){ state.days[k] = d.days[k]; });
      var mh = {}; state.morals.forEach(function(m){ mh[m.text.toLowerCase()] = 1; });
      d.morals.forEach(function(m){ if(!mh[m.text.toLowerCase()]){ mh[m.text.toLowerCase()] = 1; state.morals.push(m); } });
      if(d.start < state.start) state.start = d.start;
      save(); render(); toast('Added ' + news.length + ' days');
    };
    var replace = function(){ var le = state.lastExport; state = d; state.lastExport = le; applyTheme(); sel = today(); save(); render(); toast('Restored ' + inFile.length + ' days'); };
    var btns = [{label:'Cancel'}];
    if(have) btns.push({label:'Replace all', cls:'danger', run:replace});
    btns.push({label: have ? 'Add new days' : 'Import', cls:'primary', run: have ? merge : replace});
    ask('Import backup', 'The file has ' + inFile.length + ' logged days, ' + news.length + ' of them new. This device has ' + have + '.', btns);
  };
  r.readAsText(file);
}

  else if(t.dataset.act === 'exportCsv') exportCsv();
  else if(t.dataset.act === 'copy'){
    try{ navigator.clipboard.writeText(backupText()).then(function(){ toast('Backup copied. Paste it into a note or email.'); }, function(){ toast('Copy was blocked here. Use Export backup.'); }); }
    catch(e){ toast('Copy was blocked here. Use Export backup.'); }
  }
  else if(t.dataset.act === 'erase'){
    ask('Erase everything?', 'This deletes all ' + Object.keys(state.days).length + ' logged days and your habit setup from this device. Export a backup first if you want to keep them.',
      [{label:'Cancel'}, {label:'Erase', cls:'danger', run:function(){ state = fresh(); applyTheme(); sel = today(); save(); render(); toast('All data erased'); }}]);
  }
});

render();
if(navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
if('serviceWorker' in navigator && location.protocol === 'https:'){ try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){} }
})();
</script>
</body>
</html>
